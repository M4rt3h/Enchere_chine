<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><a href="index.html">← Retour</a><button class="sound-btn" onclick="toggleSound()">🔊</button></nav>
<div id="content" class="card">Chargement...</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
const { pseudo, visitor } = requireSession();
initSoundBtn();
const id = new URLSearchParams(location.search).get('id');
const itemRef = db.ref('items/' + id);
let tickInterval;
let lastBidSeen = null;
let lastBidder = null;
let sealShown = false;

itemRef.on('value', snap => {
  const it = snap.val();
  if (!it) { document.getElementById('content').innerHTML = 'Objet introuvable.'; return; }
  render(it);
});

function leadingTag(it, bids) {
  if (it.currentBidder === pseudo) return '<div class="leading-tag win">🟢 Tu es en tête</div>';
  const jaiDejaMise = bids.some(b => b.pseudo === pseudo);
  if (jaiDejaMise) return `<div class="leading-tag lose">🔴 Devancé par ${it.currentBidder}</div>`;
  return '';
}

function render(it) {
  clearInterval(tickInterval);
  const c = document.getElementById('content');
  const bids = Object.values(it.bids || {}).sort((a,b) => b.time - a.time);

  c.innerHTML = `
    ${it.imageUrl ? `<img src="${it.imageUrl}">` : ''}
    <div class="seal-stamp" id="seal-final">成交</div>
    <h2>${it.name} <span class="badge ${it.status}">${it.status}</span></h2>
    <p>${it.description || ''}</p>
    <div class="price" id="price-el">${it.currentBid} ¥ ${it.currentBidder ? '— ' + it.currentBidder : '(prix de départ)'}<span class="mini-seal" id="mini-seal">叫</span></div>
    ${!visitor && it.status === 'active' ? leadingTag(it, bids) : ''}
    <div class="timer" id="timer"></div>
    <div id="actions"></div>
    <h3>Historique</h3>
    <div class="history">${bids.map(b => `<div>${b.pseudo} → ${b.amount} ¥</div>`).join('') || '<div>Aucune enchère</div>'}</div>
  `;

  if (lastBidSeen !== null && it.currentBid !== lastBidSeen) {
    const mini = document.getElementById('mini-seal');
    const priceEl = document.getElementById('price-el');
    mini.classList.add('show');
    priceEl.classList.add('flash');
    setTimeout(() => { mini.classList.remove('show'); priceEl.classList.remove('flash'); }, 700);
    playDing();
    if (lastBidder === pseudo && it.currentBidder !== pseudo) vibrate([100, 60, 100]);
  }
  lastBidSeen = it.currentBid;
  lastBidder = it.currentBidder;

  if (it.status === 'ended' && !sealShown) {
    sealShown = true;
    requestAnimationFrame(() => document.getElementById('seal-final').classList.add('show'));
    playGong();
  }

  const actions = document.getElementById('actions');
  if (it.status === 'pending') {
    actions.innerHTML = `<p>⏳ En attente de lancement par l'admin.</p>`;
  } else if (it.status === 'ended') {
    actions.innerHTML = `<p>🔨 Terminé. Gagnant : <b>${it.currentBidder || 'personne'}</b></p>`;
  } else if (it.status === 'active') {
    if (visitor) {
      actions.innerHTML = `<p style="color:var(--ink-soft)">👀 Mode visiteur — enchère en cours, tu regardes.</p>`;
    } else {
      const votes = it.stopVotes || {};
      const iVoted = !!votes[pseudo];
      const votCount = Object.keys(votes).length;
      actions.innerHTML = `
        <input type="number" id="bid-amount" placeholder="Ton montant (¥)" min="${it.currentBid + 1}">
        <button onclick="placeBid(${it.currentBid})">Enchérir</button>
        <button class="stop" onclick="toggleStopVote(${iVoted})">
          ${iVoted ? '✅ Tu veux arrêter (annuler)' : '🛑 Je veux arrêter'}
        </button>
        <p style="font-size:.85em;color:#aaa">Arrêt anticipé nécessite que <b>les 2</b> soient d'accord (${votCount}/2)</p>
      `;
    }
    tickInterval = setInterval(() => tick(it), 250);
    tick(it);
  }
}

function tick(it) {
  const remaining = it.endTime - Date.now();
  const el = document.getElementById('timer');
  if (!el) return;
  if (remaining <= 0) {
    clearInterval(tickInterval);
    endAuctionOnce();
    return;
  }
  el.textContent = '⏱️ ' + fmtTime(remaining);
  el.className = 'timer' + (remaining < 15000 ? ' urgent' : '');
}

function endAuctionOnce() {
  itemRef.transaction(it => {
    if (it && it.status === 'active') it.status = 'ended';
    return it;
  });
}

function toggleStopVote(currentlyVoted) {
  itemRef.transaction(it => {
    if (!it || it.status !== 'active') return it;
    if (!it.stopVotes) it.stopVotes = {};
    if (currentlyVoted) {
      delete it.stopVotes[pseudo];
    } else {
      it.stopVotes[pseudo] = true;
    }
    // si les 2 joueurs ont voté stop -> fin immédiate
    db.ref('players').once('value').then(snap => {
      const nbPlayers = Object.keys(snap.val() || {}).length;
      if (Object.keys(it.stopVotes).length >= nbPlayers && nbPlayers > 0) {
        itemRef.update({ status: 'ended', endTime: Date.now() });
      }
    });
    return it;
  });
}

function placeBid(minBid) {
  const amount = parseInt(document.getElementById('bid-amount').value, 10);
  if (!amount || amount <= minBid) return alert('Montant invalide, doit dépasser ' + minBid);

  Promise.all([
    db.ref('items').once('value'),
    db.ref('players/' + pseudo).once('value')
  ]).then(([itemsSnap, budgetSnap]) => {
    const items = itemsSnap.val() || {};
    const monBudget = (budgetSnap.val() && budgetSnap.val().budget) || 0;
    const currentEngage = computeBudgetEngage(items, pseudo) - (items[id]?.currentBidder === pseudo ? items[id].currentBid : 0);
    if (currentEngage + amount > monBudget) {
      return alert('Budget dépassé ! Il te reste ' + (monBudget - currentEngage) + ' ¥ pour cet objet.');
    }

    itemRef.transaction(it => {
      if (!it || it.status !== 'active') return it;
      if (amount <= it.currentBid) return; // abort, quelqu'un a été plus rapide
      it.currentBid = amount;
      it.currentBidder = pseudo;
      if (it.endTime - Date.now() < 10000) it.endTime = Date.now() + 10000; // anti-snipe
      return it;
    }, (err, committed, snap) => {
      if (committed) {
        itemRef.child('bids').push({ pseudo, amount, time: Date.now() });
        document.getElementById('bid-amount').value = '';
      }
    });
  });
}
</script>
</body>
</html>
