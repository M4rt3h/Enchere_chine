<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><a href="index.html">← Retour</a></nav>
<h1>Admin ⚙️</h1>

<div class="card" id="event-toggle-card">
  <h2>Statut de l'événement</h2>
  <p id="event-status">...</p>
  <button id="event-btn" onclick="toggleEvent()"></button>
</div>

<div class="card">
  <h2>Joueurs</h2>
  <input id="new-player" placeholder="Pseudo">
  <button onclick="addPlayer()">Ajouter joueur</button>
  <div id="players-list"></div>
</div>

<div class="card">
  <h2>Ajouter un objet</h2>
  <input id="it-name" placeholder="Nom de l'objet">
  <textarea id="it-desc" placeholder="Description"></textarea>
  <input id="it-price" type="number" placeholder="Prix de départ (¥)">
  <input id="it-image" type="file" accept="image/*">
  <button onclick="addItem()">Ajouter</button>
</div>

<h2>Objets existants</h2>
<div id="items-list"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
db.ref('event/started').on('value', snap => {
  const started = !!snap.val();
  document.getElementById('event-status').textContent = started
    ? '🟢 Ouvert — les visiteurs voient le login.'
    : '🔴 Fermé — les visiteurs voient l\'écran d\'attente.';
  const btn = document.getElementById('event-btn');
  btn.textContent = started ? '🔒 Fermer / repasser en attente' : '🔓 Ouvrir les enchères';
  btn.className = started ? 'secondary' : '';
});
function toggleEvent() {
  db.ref('event/started').once('value').then(snap => {
    db.ref('event/started').set(!snap.val());
  });
}

db.ref('players').on('value', snap => {
  const players = snap.val() || {};
  document.getElementById('players-list').innerHTML =
    Object.entries(players).map(([p, data]) => `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(0,0,0,0.06)">
        ${data.avatar ? `<img src="${data.avatar}" style="width:44px;height:44px;border-radius:50%;object-fit:cover">` : `<div class="avatar-fallback" style="width:44px;height:44px;font-size:1.2em">👤</div>`}
        <div style="flex:1">
          <div><b>${p}</b> — ${data.budget} ¥</div>
          <input type="file" accept="image/*" style="margin:4px 0" onchange="uploadAvatar('${p}', this.files[0])">
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <input type="number" id="adj-${p}" placeholder="+/- ¥" style="width:80px;margin:0">
        <button style="width:auto" onclick="adjustBudget('${p}')">OK</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:16px">
        <input id="rename-${p}" placeholder="Renommer en..." style="margin:0">
        <button style="width:auto" onclick="renamePlayer('${p}')">✏️</button>
        <button class="secondary" style="width:auto" onclick="deletePlayer('${p}')">🗑️</button>
      </div>
    `).join('') || '<i>Aucun joueur</i>';
});

function addPlayer() {
  const p = document.getElementById('new-player').value.trim();
  if (!p) return;
  db.ref('players/' + p).set({ budget: BUDGET_PAR_PERSONNE, avatar: '' });
  document.getElementById('new-player').value = '';
}

function adjustBudget(p) {
  const input = document.getElementById('adj-' + p);
  const delta = parseInt(input.value, 10);
  if (!delta) return;
  db.ref('players/' + p + '/budget').transaction(b => (b || 0) + delta);
  input.value = '';
}

async function uploadAvatar(p, file) {
  if (!file) return;
  const avatar = await resizeImageToBase64(file, 300, 0.6);
  db.ref('players/' + p + '/avatar').set(avatar);
}

function deletePlayer(p) {
  if (!confirm(`Supprimer ${p} ? (son historique d'enchères reste visible, juste plus de login possible)`)) return;
  db.ref('players/' + p).remove();
}

async function renamePlayer(oldName) {
  const newName = document.getElementById('rename-' + oldName).value.trim();
  if (!newName) return;
  const [playerSnap, itemsSnap] = await Promise.all([
    db.ref('players/' + oldName).once('value'),
    db.ref('items').once('value')
  ]);
  const data = playerSnap.val();
  if (!data) return;

  // met à jour les items où ce joueur est meilleur enchérisseur + son historique de mises
  const items = itemsSnap.val() || {};
  const updates = {};
  Object.entries(items).forEach(([id, it]) => {
    if (it.currentBidder === oldName) updates[`items/${id}/currentBidder`] = newName;
    Object.entries(it.bids || {}).forEach(([bidId, b]) => {
      if (b.pseudo === oldName) updates[`items/${id}/bids/${bidId}/pseudo`] = newName;
    });
  });
  updates['players/' + newName] = data;
  updates['players/' + oldName] = null;

  await db.ref().update(updates);
  document.getElementById('rename-' + oldName).value = '';
}

async function addItem() {
  const name = document.getElementById('it-name').value.trim();
  const description = document.getElementById('it-desc').value.trim();
  const startPrice = parseInt(document.getElementById('it-price').value, 10);
  const file = document.getElementById('it-image').files[0];
  if (!name || !startPrice) return alert('Nom et prix requis');

  let imageUrl = '';
  if (file) imageUrl = await resizeImageToBase64(file);

  db.ref('items').push({
    name, description, imageUrl,
    currentBid: startPrice,
    currentBidder: '',
    status: 'pending',
    endTime: 0,
    bids: {}
  });

  document.getElementById('it-name').value = '';
  document.getElementById('it-desc').value = '';
  document.getElementById('it-price').value = '';
  document.getElementById('it-image').value = '';
}

db.ref('items').on('value', snap => {
  const items = snap.val() || {};
  const list = document.getElementById('items-list');
  list.innerHTML = '';
  Object.entries(items).forEach(([id, it]) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3>${it.name} <span class="badge ${it.status}">${it.status}</span></h3>
      <div class="price">${it.currentBid} ¥</div>
      ${it.status === 'pending' ? `<button onclick="startItem('${id}')">▶️ Lancer (5 min)</button>` : ''}
      <button class="secondary" onclick="deleteItem('${id}')">🗑️ Supprimer</button>
    `;
    list.appendChild(div);
  });
});

function startItem(id) {
  db.ref('items/' + id).update({
    status: 'active',
    endTime: Date.now() + 5 * 60 * 1000
  });
}

function deleteItem(id) {
  if (confirm('Supprimer cet objet ?')) db.ref('items/' + id).remove();
}
</script>
</body>
</html>
