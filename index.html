<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enchères déménagement</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="waiting-screen" class="card waiting-panel" style="display:none">
  <div class="lantern">🏮</div>
  <h2>Patience...</h2>
  <p style="color:var(--ink-soft)">Les enchères commenceront dès que tout le monde sera réuni.</p>
  <div class="waiting-dots"><span></span><span></span><span></span></div>
</div>

<div id="login-screen" style="display:none">
  <h1>Enchères 🏷️</h1>
  <p>Choisis ton profil.</p>
  <div id="avatar-grid" style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:8px"></div>
  <button class="secondary" onclick="loginVisitor()">👀 Juste regarder (visiteur)</button>
</div>

<div id="main-screen" style="display:none">
  <div class="budget-bar">
    <span id="who"></span>
    <span id="budget-line">Budget restant: <b id="budget-left"></b> ¥</span>
  </div>
  <nav>
    <a href="admin.html">⚙️ Admin</a>
    <a href="bilan.html">📊 Bilan</a>
    <a href="#" onclick="changeProfile()">🔁 Changer</a>
    <button class="sound-btn" onclick="toggleSound()">🔊</button>
  </nav>
  <h2>Objets</h2>
  <div id="items-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
db.ref('players').once('value').then(snap => {
  const players = snap.val() || {};
  const grid = document.getElementById('avatar-grid');
  Object.entries(players).forEach(([p, data]) => {
    const avatar = data && data.avatar;
    const el = document.createElement('div');
    el.className = 'avatar-pick';
    el.onclick = () => { setPseudo(p); localStorage.removeItem('visitor'); showMain(); };
    el.innerHTML = `
      ${avatar ? `<img src="${avatar}">` : `<div class="avatar-fallback">👤</div>`}
      <div>${p}</div>
    `;
    grid.appendChild(el);
  });
});

function loginVisitor() {
  setVisitor();
  showMain();
}

function changeProfile() {
  clearSession();
  location.reload();
}

function showMain() {
  const pseudo = getPseudo();
  const visitor = getVisitor();
  if (!pseudo && !visitor) return;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  document.getElementById('who').textContent = visitor ? '👀 Visiteur' : '👤 ' + pseudo;
  document.getElementById('budget-line').style.display = visitor ? 'none' : 'inline';

  if (!visitor) {
    db.ref('players/' + pseudo).on('value', s => window._monBudget = (s.val() && s.val().budget) || 0);
  }

  db.ref('items').on('value', snap => {
    const items = snap.val() || {};
    if (!visitor) {
      document.getElementById('budget-left').textContent =
        (window._monBudget || 0) - computeBudgetEngage(items, pseudo);
    }

    const entries = Object.entries(items);
    const active = entries.find(([, it]) => it.status === 'active');
    const pending = entries.filter(([, it]) => it.status === 'pending');
    const ended = entries.filter(([, it]) => it.status === 'ended');

    const list = document.getElementById('items-list');
    let html = '';

    if (active) {
      const [id, it] = active;
      html += `
        <div class="card hero-item">
          <div class="hero-label">🔥 Objet du moment</div>
          ${it.imageUrl ? `<img src="${it.imageUrl}">` : ''}
          <h3>${it.name}</h3>
          <div class="price">${it.currentBid} ¥ ${it.currentBidder ? '(' + it.currentBidder + ')' : ''}</div>
          <div class="timer" id="hero-timer" data-end="${it.endTime}"></div>
          <a href="item.html?id=${id}"><button>${visitor ? 'Voir' : 'Voir / Enchérir'}</button></a>
        </div>`;
    }

    if (pending.length) {
      html += `<div class="card"><h3>🕒 À venir</h3>` + pending.map(([id, it], i) => `
        <a href="item.html?id=${id}" style="color:inherit">
          <div class="queue-row"><span class="queue-num">${i + 1}</span>${it.name} <span style="color:var(--ink-soft);margin-left:auto">dès ${it.currentBid} ¥</span></div>
        </a>`).join('') + `</div>`;
    }

    if (ended.length) {
      html += `<div class="card"><h3>🔨 Terminés</h3>` + ended.map(([id, it]) => `
        <a href="item.html?id=${id}" style="color:inherit">
          <div class="ended-row">${it.name} <span style="margin-left:auto"><b>${it.currentBidder || '—'}</b> · ${it.currentBid} ¥</span></div>
        </a>`).join('') + `</div>`;
    }

    if (!active && !pending.length && !ended.length) html = '<p style="text-align:center;color:var(--ink-soft)">Aucun objet pour l\'instant.</p>';
    list.innerHTML = html;

    clearInterval(window._heroTick);
    if (active) {
      window._heroTick = setInterval(() => {
        const el = document.getElementById('hero-timer');
        if (!el) return clearInterval(window._heroTick);
        const remaining = parseInt(el.dataset.end, 10) - Date.now();
        el.textContent = '⏱️ ' + fmtTime(remaining);
        el.className = 'timer' + (remaining < 15000 ? ' urgent' : '');
      }, 250);
    }
  });
}

function renderScreen(started) {
  const waiting = document.getElementById('waiting-screen');
  const loginS = document.getElementById('login-screen');
  const mainS = document.getElementById('main-screen');
  if (!started) {
    waiting.style.display = 'block';
    loginS.style.display = 'none';
    mainS.style.display = 'none';
    return;
  }
  waiting.style.display = 'none';
  if (getPseudo() || getVisitor()) showMain();
  else loginS.style.display = 'block';
}

db.ref('event/started').on('value', snap => renderScreen(!!snap.val()));
initSoundBtn();
</script>
</body>
</html>
