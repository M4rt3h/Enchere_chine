<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enchères déménagement</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen">
  <h1>Enchères 🏷️</h1>
  <p>Choisis ton pseudo pour commencer.</p>
  <select id="pseudo-select"><option value="">-- choisir --</option></select>
  <button onclick="login()">Entrer</button>
</div>

<div id="main-screen" style="display:none">
  <div class="budget-bar">
    <span id="who"></span>
    <span>Budget restant: <b id="budget-left"></b> ¥</span>
  </div>
  <nav><a href="admin.html">⚙️ Admin</a></nav>
  <h2>Objets</h2>
  <div id="items-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
db.ref('players').once('value').then(snap => {
  const sel = document.getElementById('pseudo-select');
  Object.keys(snap.val() || {}).forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  });
});

function login() {
  const p = document.getElementById('pseudo-select').value;
  if (!p) return alert('Choisis un pseudo');
  setPseudo(p);
  showMain();
}

function showMain() {
  const pseudo = getPseudo();
  if (!pseudo) return;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  document.getElementById('who').textContent = '👤 ' + pseudo;

  db.ref('items').on('value', snap => {
    const items = snap.val() || {};
    document.getElementById('budget-left').textContent =
      BUDGET_PAR_PERSONNE - computeBudgetEngage(items, pseudo);

    const list = document.getElementById('items-list');
    list.innerHTML = '';
    Object.entries(items).forEach(([id, it]) => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        ${it.imageUrl ? `<img src="${it.imageUrl}">` : ''}
        <h3>${it.name} <span class="badge ${it.status}">${it.status}</span></h3>
        <div class="price">${it.currentBid} ¥ ${it.currentBidder ? '(' + it.currentBidder + ')' : ''}</div>
        <a href="item.html?id=${id}"><button>Voir / Enchérir</button></a>
      `;
      list.appendChild(div);
    });
  });
}

if (getPseudo()) showMain();
</script>
</body>
</html>
